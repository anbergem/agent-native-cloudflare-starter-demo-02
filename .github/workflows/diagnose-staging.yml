# Throwaway diagnostic. Delete once the staging smoke passes.
#
# `create-job` and `agent-chat` time out from a GitHub runner while the very
# same calls answer in under 500ms from a developer machine, and `auth/login` —
# also a POST, also a write — succeeds from the runner. This job runs the same
# requests from a runner and reports, for each, the status, the elapsed time and
# the `cf-ray` header, whose suffix names the Cloudflare colo that served it.
name: Diagnose staging
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: diagnose-staging
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: staging
    env:
      SEED_PASSWORD: ${{ secrets.SEED_PASSWORD }}
      STAGING_URL: ${{ vars.STAGING_URL }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Baseline — no reset before the write
        run: node .github/diagnose-staging.mjs
      # The smoke starts zero seconds after this exact command. Run it here so
      # the probe below sees the same preconditions the smoke does.
      - name: Reset QA scenario, exactly as the deploy does
        run: >-
          node scripts/seed.mjs --target d1-remote --env staging --reset
          --base-url "$STAGING_URL"
      # `wrangler tail` streams what the Worker logs and throws while the probe
      # runs, which is the one view we have not had of the hang.
      - name: After the reset — the smoke's preconditions, with a tail attached
        run: |
          pnpm exec wrangler tail --env staging --format json 2>"$RUNNER_TEMP/tail.err" \
            | jq -c '{method: .event.request.method, url: (.event.request.url // "" | sub("^https?://[^/]+"; "")), outcome: .outcome, exceptions: [.exceptions[]?.message], logs: [.logs[]?.message[0]?]}' > "$RUNNER_TEMP/tail.json" &
          TAIL_PID=$!
          sleep 12
          node .github/diagnose-staging.mjs || true
          sleep 5
          kill "$TAIL_PID" 2>/dev/null || true
          echo "=== worker tail: every request it saw ==="
          cat "$RUNNER_TEMP/tail.json" || true
          echo
          echo "=== tail stderr ==="
          head -c 1000 "$RUNNER_TEMP/tail.err" || true
