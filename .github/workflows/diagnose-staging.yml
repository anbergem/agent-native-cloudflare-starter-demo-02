# Throwaway diagnostic. Delete once the staging smoke passes.
#
# `create-job` and `agent-chat` time out from a GitHub runner while the very
# same calls answer in under 500ms from a developer machine, and `auth/login` —
# also a POST, also a write — succeeds from the runner. This job runs the same
# requests from a runner and reports, for each, the status, the elapsed time and
# the `cf-ray` header, whose suffix names the Cloudflare colo that served it.
name: Diagnose staging
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: diagnose-staging
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: staging
    env:
      SEED_PASSWORD: ${{ secrets.SEED_PASSWORD }}
      STAGING_URL: ${{ vars.STAGING_URL }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: 0. What and where is this database
        run: |
          pnpm exec wrangler d1 info acme-ops-staging --env staging || true
          pnpm exec wrangler d1 list --json | jq -c '.[] | {name, uuid, created_at}' || true
      - name: 1. Baseline — no reset
        run: node .github/diagnose-staging.mjs
      # The reset has two halves: a bulk `wrangler d1 execute --remote` of the
      # scenario SQL, and five user registrations driven through the Worker.
      # Run them separately to see which one stops writes completing.
      - name: 2. Reset SQL only (--skip-users), then probe
        run: |
          node scripts/seed.mjs --target d1-remote --env staging --reset --skip-users
          node .github/diagnose-staging.mjs
      - name: 3. Full reset (SQL + user registrations), then probe
        run: |
          node scripts/seed.mjs --target d1-remote --env staging --reset --base-url "$STAGING_URL"
          node .github/diagnose-staging.mjs
