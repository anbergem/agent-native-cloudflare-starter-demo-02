# Throwaway diagnostic. Delete once the staging smoke passes.
#
# `create-job` and `agent-chat` time out from a GitHub runner while the very
# same calls answer in under 500ms from a developer machine, and `auth/login` —
# also a POST, also a write — succeeds from the runner. This job runs the same
# requests from a runner and reports, for each, the status, the elapsed time and
# the `cf-ray` header, whose suffix names the Cloudflare colo that served it.
name: Diagnose staging
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: diagnose-staging
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: staging
    env:
      SEED_PASSWORD: ${{ secrets.SEED_PASSWORD }}
      STAGING_URL: ${{ vars.STAGING_URL }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: 0. What and where is this database
        run: |
          pnpm exec wrangler d1 info acme-ops-staging --env staging || true
          pnpm exec wrangler d1 list --json | jq -c '.[] | {name, uuid, created_at}' || true
      - name: Tail the Worker across one first write
        run: |
          pnpm exec wrangler tail --env staging --format json 2>"$RUNNER_TEMP/t.err" \
            | jq --unbuffered -c '{u: (.event.request.url // "" | sub("^https?://[^/]+"; "")), o: .outcome, ex: [.exceptions[]?.message], lg: [.logs[]?.message[0]?]}' \
            | tee "$RUNNER_TEMP/tail.ndjson" &
          sleep 15
          node .github/diagnose-firstwrite.mjs || true
          sleep 20
          pkill -f "wrangler tail" || true
          echo "=== what the Worker saw ==="
          cat "$RUNNER_TEMP/tail.ndjson" || true
